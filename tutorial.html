<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OSCAR: The Investor's Tutorial</title>
<meta name="description" content="Learn the essentials of investing before you start. Stocks, ETFs, fees, CHESS and more, explained simply."/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #08090d;
  --bg2: #0d0f17;
  --bg3: #111420;
  --text: #f0f2f8;
  --muted: rgba(240,242,248,0.56);
  --dim: rgba(240,242,248,0.3);
  --green: #00ff87;
  --blue: #4d9fff;
  --violet: #a259ff;
  --amber: #ffc642;
  --red: #ff4d6a;
  --line: rgba(255,255,255,0.07);
  --line2: rgba(255,255,255,0.12);
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { width:100%; height:100%; overflow:hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.55;
}

/* ── BACKGROUND ─────────────────────────────── */
.bg {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 900px 500px at 10% 10%, rgba(77,159,255,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 700px 600px at 90% 90%, rgba(162,89,255,0.06) 0%, transparent 60%);
}
.scanlines {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,0.009) 2px,rgba(255,255,255,0.009) 4px);
}
.stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.star {
  position: absolute; width: 2px; height: 2px; border-radius: 50%; background: white;
  animation: sp var(--d,4s) ease-in-out infinite var(--dl,0s);
}
@keyframes sp { 0%,100%{opacity:var(--mn,.1)} 50%{opacity:var(--mx,.5)} }

/* ── NAV ─────────────────────────────────────── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px;
  background: rgba(8,9,13,0.75);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
}
.nav-brand {
  font-family: 'Syne', sans-serif; font-weight: 800;
  font-size: 1rem; letter-spacing: 0.1em; color: var(--text);
  text-decoration: none; display: flex; align-items: center; gap: 8px;
}
.nav-brand svg { width: 20px; height: 20px; }
.nav-back {
  font-size: 0.8rem; color: var(--muted); text-decoration: none;
  display: flex; align-items: center; gap: 6px; transition: color 0.2s;
}
.nav-back:hover { color: var(--text); }

/* ── PROGRESS ────────────────────────────────── */
.prog-bar {
  position: fixed; top: 52px; left: 0; right: 0; z-index: 49;
  height: 3px; background: var(--line);
}
.prog-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--blue), var(--violet));
  box-shadow: 0 0 10px rgba(77,159,255,0.4);
  transition: width 0.55s cubic-bezier(0.34,1.2,0.64,1);
}

/* ── SLIDES ──────────────────────────────────── */
.slide {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 80px 24px 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.45s ease;
  z-index: 1;
}
.slide.active { opacity: 1; pointer-events: auto; }

/* ── CONTENT CARD ────────────────────────────── */
.card {
  background: rgba(13,15,23,0.88);
  border: 1px solid var(--line2);
  border-radius: 24px;
  width: min(860px, 100%);
  box-shadow: 0 24px 64px rgba(0,0,0,0.5);
  overflow: hidden;
  position: relative;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--blue), var(--violet), transparent);
}

/* card with two columns */
.card-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 380px;
}
.card-left {
  padding: 36px 36px 28px;
  display: flex; flex-direction: column; justify-content: center;
  border-right: 1px solid var(--line);
}
.card-right {
  padding: 28px 24px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.15);
}

/* card single column (for quiz checks) */
.card-body.single { grid-template-columns: 1fr; }
.card-body.single .card-left { border-right: none; padding: 36px 40px 28px; max-width: 640px; margin: 0 auto; width: 100%; }

.card-chapter {
  font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
  color: var(--blue); letter-spacing: 0.12em; text-transform: uppercase;
  margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
}
.chapter-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--blue); box-shadow: 0 0 6px var(--blue);
}
.card-title {
  font-family: 'Syne', sans-serif; font-weight: 800;
  font-size: clamp(1.4rem, 3vw, 2rem); letter-spacing: -0.02em;
  line-height: 1.1; margin-bottom: 14px;
}
.card-body-text {
  font-size: 0.92rem; color: var(--muted); line-height: 1.7; margin-bottom: 16px;
}
.card-body-text strong { color: var(--text); font-weight: 600; }

.def-box {
  background: rgba(77,159,255,0.06);
  border: 1px solid rgba(77,159,255,0.2);
  border-radius: 12px; padding: 13px 16px; margin-bottom: 16px;
}
.def-label {
  font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
  color: var(--blue); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px;
}
.def-text { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }
.def-text strong { color: var(--text); }

.pts { display: flex; flex-direction: column; gap: 7px; }
.pt {
  display: flex; align-items: flex-start; gap: 9px;
  font-size: 0.85rem; color: var(--muted); line-height: 1.5;
}
.pt-icon {
  width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; margin-top: 3px;
  background: rgba(77,159,255,0.1); border: 1px solid rgba(77,159,255,0.3);
  display: flex; align-items: center; justify-content: center;
}
.pt-icon svg { width: 8px; height: 8px; }

/* visual panel */
.vis { width: 100%; max-width: 300px; }
.vis svg { width: 100%; height: auto; }

/* quiz answers */
.answers { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.answer {
  width: 100%; display: flex; align-items: center; gap: 13px;
  padding: 13px 16px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--line2); border-radius: 13px;
  color: var(--text); font-size: 0.92rem;
  font-family: 'DM Sans', sans-serif; font-weight: 500;
  cursor: pointer; text-align: left;
  transition: all 0.18s ease;
}
.answer:hover:not(:disabled) {
  border-color: rgba(77,159,255,0.4);
  background: rgba(77,159,255,0.05);
  transform: translateX(4px);
}
.answer.correct { border-color: var(--green); background: rgba(0,255,135,0.06); }
.answer.wrong { border-color: var(--red); background: rgba(255,77,106,0.06); }
.answer-key {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  background: var(--line); border: 1px solid var(--line2);
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--dim);
  transition: all 0.18s;
}
.answer:hover:not(:disabled) .answer-key { background: rgba(77,159,255,0.15); border-color: rgba(77,159,255,0.4); color: var(--blue); }
.answer.correct .answer-key { background: rgba(0,255,135,0.15); border-color: var(--green); color: var(--green); }
.answer.wrong .answer-key { background: rgba(255,77,106,0.1); border-color: var(--red); color: var(--red); }

.feedback {
  padding: 11px 15px; border-radius: 11px; font-size: 0.85rem; line-height: 1.5;
  display: none;
}
.feedback.show { display: block; }
.feedback.ok { background: rgba(0,255,135,0.07); color: var(--green); border: 1px solid rgba(0,255,135,0.2); }
.feedback.no { background: rgba(255,77,106,0.07); color: var(--red); border: 1px solid rgba(255,77,106,0.2); }

/* card footer */
.card-footer {
  padding: 16px 28px;
  border-top: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
}
.dots { display: flex; gap: 6px; }
.dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--line2);
  transition: background 0.25s, transform 0.25s; cursor: pointer;
}
.dot.active { background: var(--blue); transform: scale(1.35); }
.dot.done { background: var(--green); }
.nav-btns { display: flex; gap: 9px; }

.btn {
  padding: 10px 22px; border-radius: 11px; font-weight: 600;
  font-size: 0.88rem; font-family: 'DM Sans', sans-serif;
  cursor: pointer; border: 1px solid; transition: all 0.2s;
}
.btn-blue { background: var(--blue); color: #04111e; border-color: var(--blue); }
.btn-blue:hover { background: #6fb3ff; box-shadow: 0 6px 20px rgba(77,159,255,0.3); }
.btn-green { background: var(--green); color: #04120a; border-color: var(--green); }
.btn-green:hover { background: #33ffaa; box-shadow: 0 6px 20px rgba(0,255,135,0.3); }
.btn-ghost { background: transparent; color: var(--muted); border-color: var(--line2); }
.btn-ghost:hover { color: var(--text); background: rgba(255,255,255,0.04); }

@media (max-width: 720px) {
  .card-body { grid-template-columns: 1fr; }
  .card-left { border-right: none; border-bottom: 1px solid var(--line); padding: 24px 20px; }
  .card-right { padding: 20px; min-height: 180px; }
  nav { padding: 12px 18px; }
}
</style>
</head>

// ═══════════════════════════════════════════════
//  RENDER ENGINE
// ═══════════════════════════════════════════════

let cur = 0;
let canProceed = true;
const TOTAL = CHAPTERS.length;

function pt(text) {
  return `<div class="pt">
    <div class="pt-icon">
      <svg viewBox="0 0 10 10" fill="none">
        <path d="M2,5 L4.5,7.5 L8,3" stroke="#4d9fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span>${text}</span>
  </div>`;
}

function buildSlide(ch, i) {
  const div = document.createElement('div');
  div.className = 'slide';
  div.id = 'slide' + i;

  const isQuiz = ch.type === 'quiz';
  const isComplete = ch.type === 'complete';

  const opts = isQuiz ? ch.options.map((o, j) =>
    `<button class="answer" id="ans${i}_${j}" onclick="answer(${i},${j})">
      <span class="answer-key">${['A','B','C','D'][j]}</span>
      <span>${o}</span>
    </button>`
  ).join('') : '';

  const defHtml = ch.def
    ? `<div class="def-box"><div class="def-label">Definition: ${ch.def.k}</div><div class="def-text">${ch.def.v}</div></div>`
    : '';

  const ptsHtml = ch.pts
    ? `<div class="pts">${ch.pts.map(pt).join('')}</div>`
    : '';

  const dots = CHAPTERS.map((_,x) =>
    `<div class="dot${x<i?' done':x===i?' active':''}" onclick="goTo(${x})"></div>`
  ).join('');

  const isFinal = i === TOTAL - 1;
  const nextLabel = isQuiz ? 'Answer to continue' : isFinal ? 'Find my platform' : 'Continue';
  const nextClass = isFinal ? 'btn btn-green' : 'btn btn-blue';

  if (isQuiz) {
    div.innerHTML = `
      <div class="card">
        <div class="card-body single">
          <div class="card-left">
            <div class="card-chapter"><div class="chapter-dot"></div>${ch.chapter}</div>
            <div class="card-title">${ch.title}</div>
            <div class="card-body-text" style="margin-bottom:20px;">${ch.question}</div>
            <div class="answers">${opts}</div>
            <div class="feedback" id="fb${i}"></div>
          </div>
        </div>
        <div class="card-footer">
          <div class="dots">${dots}</div>
          <div class="nav-btns">
            ${i > 0 ? `<button class="btn btn-ghost" onclick="go(${i-1})">Back</button>` : ''}
            <button class="btn btn-blue" id="next${i}" disabled style="opacity:0.4;cursor:not-allowed;">${nextLabel}</button>
          </div>
        </div>
      </div>`;
  } else {
    div.innerHTML = `
      <div class="card">
        <div class="card-body">
          <div class="card-left">
            <div class="card-chapter"><div class="chapter-dot"></div>${ch.chapter}</div>
            <div class="card-title">${ch.title}</div>
            <div class="card-body-text">${ch.body}</div>
            ${defHtml}
            ${ptsHtml}
          </div>
          <div class="card-right">
            <div class="vis">${VISUALS[ch.vis] || ''}</div>
          </div>
        </div>
        <div class="card-footer">
          <div class="dots">${dots}</div>
          <div class="nav-btns">
            ${i > 0 ? `<button class="btn btn-ghost" onclick="go(${i-1})">Back</button>` : ''}
            <button class="${nextClass}" onclick="go(${isFinal ? -1 : i+1})">${nextLabel}</button>
          </div>
        </div>
      </div>`;
  }

  return div;
}

function go(i) {
  if (i === -1) { window.location.href = 'app.html#quiz'; return; }
  const prev = document.getElementById('slide' + cur);
  if (prev) prev.classList.remove('active');
  cur = i;
  const next = document.getElementById('slide' + cur);
  if (next) next.classList.add('active');
  document.getElementById('progFill').style.width = ((cur + 1) / TOTAL * 100) + '%';
  window.scrollTo(0, 0);
}

window.goTo = function(i) {
  // only allow going back or to already-seen slides
  if (i <= cur) go(i);
};

window.answer = function(slideIdx, ansIdx) {
  const ch = CHAPTERS[slideIdx];
  if (!ch.q) return;

  // Disable all options
  for (let j = 0; j < ch.options.length; j++) {
    const el = document.getElementById('ans' + slideIdx + '_' + j);
    if (el) {
      el.setAttribute('disabled', '');
      if (j === ch.correct) el.classList.add('correct');
      else if (j === ansIdx) el.classList.add('wrong');
    }
  }

  const isOk = ansIdx === ch.correct;
  const fb = document.getElementById('fb' + slideIdx);
  if (fb) {
    fb.textContent = isOk ? ch.feedbackOk : ch.feedbackNo;
    fb.className = 'feedback show ' + (isOk ? 'ok' : 'no');
  }

  // Enable next button
  const nb = document.getElementById('next' + slideIdx);
  if (nb) {
    nb.removeAttribute('disabled');
    nb.style.opacity = '1';
    nb.style.cursor = 'pointer';
    nb.onclick = () => go(slideIdx + 1);
  }
};

// Patch quiz chapters to have .q property (legacy compat)
CHAPTERS.forEach(ch => {
  if (ch.type === 'quiz') ch.q = true;
});

// Build all slides
const container = document.getElementById('slides');
CHAPTERS.forEach((ch, i) => {
  container.appendChild(buildSlide(ch, i));
});

// Activate first
go(0);

// Stars
const starsEl = document.getElementById('stars');
for (let i = 0; i < 60; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const d = 3 + Math.random() * 7, dl = Math.random() * -10;
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${d}s;--dl:${dl}s;--mn:${0.05+Math.random()*0.1};--mx:${0.3+Math.random()*0.5}`;
  starsEl.appendChild(s);
}

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') {
    const ch = CHAPTERS[cur];
    if (ch.type !== 'quiz') {
      const isFinal = cur === TOTAL - 1;
      go(isFinal ? -1 : cur + 1);
    }
  }
  if (e.key === 'ArrowLeft' && cur > 0) go(cur - 1);
});
</script>
